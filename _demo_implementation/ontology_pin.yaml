# Recommendation #2: pin the ontology your build speaks.
#
# The DBO gains types continuously -- the ASHP additions in this repository's
# recent history are a live example. A build that validates against "whatever
# is on master today" is not reproducible, and a customer's config that passed
# last month may not pass now.
#
# We pin a *content digest* of ontology/yaml/resources rather than a git
# revision. When the ontology is vendored inside the consuming repository, a
# git pin drifts on every unrelated commit; the digest changes only when the
# vocabulary itself changes, which is the thing we actually care about.
#
# Regenerate with:
#   python -c "from bms_dbo.ontology import *; print(ontology_digest(default_resources_root()))"
